# macOS/ngrok-only ingress. ngrok provides public TLS; this listener is loopback-only on the host.
server {
    listen 18080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /webhooks/feishu/ {
        # 2026-09-21: 不带末尾 /,保留完整路径给 gateway(server.js:143 regex 匹配 /webhooks/<channel>/<account_id>)
        proxy_pass http://gateway:8787;
    }

    # 飞书卡片按钮回调使用独立 URL；必须经过 Gateway 再进入 P8P9 状态机。
    location = /feishu/card/callback {
        proxy_pass http://gateway:8787;
    }

    location /admin/feishu-cfg/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://feishu_cfg:5003/;
    }

    # 2026-09-21 兜底:前端模板用 fetch('/api/...') 时(相对路径解析到 host 根)
    # 也能命中 feishu_cfg 的 Flask 路由,避免 404。
    # 与 /admin/feishu-cfg/ 同样 BasicAuth,避免暴露配置 API。
    location /api/feishu/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://feishu_cfg:5003/api/feishu/;
    }

    location /admin/p6/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://p6:5002/;
    }

    # P7 风险研判页面与 API 复用 p6 容器，不增加独立服务。
    location /admin/p7/api/a6/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://p6:5002/api/a6/;
    }

    location /admin/p7/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://p6:5002/p7/;
    }

    location /admin/config/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://app_config:5000/;
    }

    # 上传页使用 P8P9 校验的限时签名链接/token，不需要 Nginx 管理员登录。
    # 仅公开这两个路径；其它 /api/closure/（包括作业详情）继续要求 Basic Auth。
    location = /api/closure/upload {
        auth_basic off;
        client_max_body_size 25m;
        proxy_pass http://p8p9:8089;
    }

    location ^~ /api/closure/upload/ {
        auth_basic off;
        client_max_body_size 25m;
        proxy_pass http://p8p9:8089;
    }

    location /api/closure/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://p8p9:8089;
    }

    # 2026-09-21 兜底:index_config.html:352 用 fetch('/api/test/llm') 等相对路径,
    # 浏览器解析到 host 根 → /api/test/llm 不会命中 /admin/config/(后者需要 /admin/ 前缀)。
    # 加上 /api/ 直通到 app_config:5000,前端"测试连接 / 保存配置"才能跑。
    # 与 /admin/config/ 同 BasicAuth,避免暴露 LLM/VL 配置 API。
    location /api/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://app_config:5000/api/;
    }

    location / {
        return 404 "Not Found";
    }
}
