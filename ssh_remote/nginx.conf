worker_processes 1;
pid /Users/edge_security/ssh_remote/nginx.pid;
error_log /Users/edge_security/ssh_remote/error.log warn;

events { worker_connections 128; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /Users/edge_security/ssh_remote/access.log;
    client_max_body_size 100m;

    server {
        listen 127.0.0.1:18080;
        server_name _;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location ^~ /sshws/ {
            auth_basic "SSH Tunnel";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.ssh;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://127.0.0.1:18082;
        }

        location = /skill {
            absolute_redirect off;
            return 308 /skill/;
        }
        location /skill/ {
            auth_basic "Skill Platform";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.admin;
            proxy_pass http://127.0.0.1:8765/;
        }

        location / {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://127.0.0.1:18081;
        }
    }
}
