    - id: archive-cases-rule-conflict
      description: 挖掘规则冲突案例
      command: archive cases TASK-WELD-01-20260804-001 --type rule_conflict
      expected:
        exit_code: 0
        result[0].type: rule_conflict

    - id: archive-performance
      description: 分析处置效果
      command: archive performance TASK-WELD-01-20260804-001
      expected:
        exit_code: 0
        result.metrics: exists
