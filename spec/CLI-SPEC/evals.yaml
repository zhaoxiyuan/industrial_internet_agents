      description: 生成规则优化建议
      command: archive suggestions TASK-WELD-01-20260804-001
      expected:
        exit_code: 0
        result: array
        result[0].priority: exists

# ============================================================
# 全局质量门禁
# ============================================================

quality_gates:
  - name: all_commands_require_auth
    description: 所有命令需要认证信息
    check: |
      执行任何命令前验证 --config 或环境变量包含有效认证

  - name: json_output_has_schema_version
    description: JSON输出必须包含schema_version
    check: |
      所有 --output json 的响应必须包含 schema_version 字段

  - name: error_codes_match_contract
    description: 错误码必须与contract.yaml一致
    check: |
      所有错误响应的 code 字段必须在 contract.yaml errors.definitions 中定义

  - name: dry_run_produces_preview
    description: dry-run模式不产生副作用
    check: |
      --dry-run 执行后状态不变，仅返回预览

  - name: idempotent_operations_safe
    description: 幂等操作重复执行安全
    check: |
      instance-create, monitor start 等幂等操作重复调用不产生错误

  - name: human_confirm_required_for_high_risk
    description: 高风险操作需要人工确认
    check: |
      disposition confirm --action pause/resume 和 closure close 在高风险场景返回 exit_code: 3

# ============================================================
# 测试夹具路径
# ============================================================

fixtures:
  path: ./CLI-SPEC/fixtures
  files:
    valid_application: valid_application.json
    invalid_json: invalid.json
    valid_task: TASK-WELD-01-20260804-001
    valid_permit: PD-20260804001
    valid_candidate_event: CE-20260804001
    valid_risk_event: RE-20260804001
    valid_disposition_task: DT-20260804001