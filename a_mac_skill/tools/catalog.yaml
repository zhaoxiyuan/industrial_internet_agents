tools:
- name: read_p7_events
  description: 读取 P7 阶段产出的风险事件列表。
  inputSchema: schemas/requests/read_p7_events.json
  outputSchema: schemas/requests/result.json
  adapter:
    kind: mcp
    sourceFile: scripts/mcp_server.py
    symbol: read_p7_events
    status: ready
  services:
  - p8p9
  - gateway
  timeoutSeconds: 60
  concurrency: 1
  effect: read
  retry:
    maxAttempts: 1
  idempotency: requestId + job_id; timeout query before retry
  context:
  - tenant
  - site
  - actor
  - runId
  - threadId
  permission: industrial.operator
- name: open_work_ticket
