# Apple Silicon/macOS Docker Desktop deployment.
# Run from a/deploy:
# docker compose -p industrial-agents-mac -f docker-compose.mac.yml up -d --build
services:
  gateway:
    build:
      context: ../gateway
    image: a-gateway:latest
    container_name: a-gateway
    restart: unless-stopped
    # 所有运行时凭证来自项目根 .env。
    env_file: ../.env
    environment:
      A_WEBUI_HOST: webui
      A_WEBUI_PORT: "8080"
      A_P8P9_HOST: p8p9
      A_P8P9_PORT: "8089"
    # 2026-09-21: Dockerfile 硬编码 --config config/config.container.json,
    # 但 container.json 里 feishu.enabled=false,导致表单保存的 P8P9 账号永远进不来,
    # /webhooks/feishu/* 全部 CHANNEL_DISABLED 拦截飞书 url_verification,
    # 飞书 admin 一直显示 "Challenge code没有返回"。
    # 这里用 command 强制让 gateway 加载表单保存的 config.feishu.local.json
    # (form 写 channels.feishu.*;基础 host/port/storage 从 local.json 默认)。
    command: ["node", "src/index.js", "--config", "/app/config/config.feishu.local.json"]
    # 2026-09-21: 把 8787 暴露给宿主机 loopback,让宿主机 chat_reply daemon
    # 能直连 gateway /v1/events(轮询入站事件)和 /v1/messages/reply(回写飞书)。
    # 仅绑 127.0.0.1,不走公网;CG_API_KEY 仍守住 /v1/* 接口。
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../data:/app/data
      # 2026-09-21: 挂载 config/ 让 feishu_cfg 表单保存的 config.feishu.local.json 实时生效
      - ../gateway/config:/app/config:ro
    networks: [internal]

  p6:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.p6
    image: a-p6:latest
    container_name: a-p6
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../data:/srv/app/data
      - ../A5/logs:/srv/app/A5/logs
    networks: [internal]

  # P8 飞书私聊回复消费者。复用 p6 镜像内已安装的 Python/LLM 依赖，
  # 通过 Docker DNS 访问 gateway，避免 Mac 宿主机 Python 3.9 的依赖缺失。
  chat_reply:
    image: a-p6:latest
    container_name: a-chat-reply
    restart: unless-stopped
    env_file: ../.env
    environment:
      GATEWAY_HOST: http://gateway:8787
    working_dir: /srv/app
    command:
      - python
      - -m
      - A7.adapters.chat_reply
      - run
      - --account-id
      - P8P9
      - --initial-sequence
      - "4"
      - --interval
      - "1"
    volumes:
      # 配置页可在运行期间切换模型；P8 每次调用都从根 .env 读取最新值。
      - ../.env:/srv/app/.env:ro
      - ../data:/srv/app/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal]

  p8p9:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.p8p9
    image: a-p8p9:latest
    container_name: a-p8p9
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../data:/srv/app/data
    networks: [internal]

  app_config:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app_config
    image: a-app-config:latest
    container_name: a-app-config
    restart: unless-stopped
    env_file: ../.env
    volumes:
      # 2026-09-21: app_config 表单保存写到根 .env(跟 feishu_cfg 一样)。
      # saved_configs.json(命名配置库)保留在 agent_config/。
      - ../.env:/srv/app/.env
      - ../agent_config:/srv/app/agent_config
    networks: [internal]

  feishu_cfg:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.feishu_cfg
    image: a-feishu-cfg:latest
    container_name: a-feishu-cfg
    restart: unless-stopped
    env_file: ../.env
    environment:
      # 容器内的 127.0.0.1 是 feishu_cfg 自己；监听功能应通过 Docker DNS
      # 连接同一 internal 网络中的 Gateway。
      GATEWAY_HOST: http://gateway:8787
    volumes:
      - ../.env:/srv/app/.env
      - ../agent_config:/srv/app/agent_config
      - ../feishu_gateway_cli:/srv/app/feishu_gateway_cli
      - ../gateway:/srv/app/gateway
    networks: [internal]

  webui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webui
    image: a-webui:latest
    container_name: a-webui
    restart: unless-stopped
    env_file: ../.env
    environment:
      A_WEBUI_HOST: 0.0.0.0
      A_WEBUI_PORT: "8080"
      A_P8P9_BASE_URL: http://p8p9:8089
    volumes:
      - ../data:/srv/app/data
      - ../agent_config:/srv/app/agent_config
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: a-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/mac-ngrok.conf:/etc/nginx/conf.d/agent.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - gateway
      - p6
      - p8p9
      - app_config
      - feishu_cfg
      - webui
    networks: [internal]

networks:
  internal:
    driver: bridge
