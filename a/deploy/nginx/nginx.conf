# a/deploy/nginx/nginx.conf — Nginx 主配置(events + http 块)
#
# 设计要点:
#   - worker 数量交给 docker 镜像默认值(nginx:1.27-alpine 默认 auto)
#   - http 块只放通用设置 + include conf.d/*;具体 server 块在 conf.d/agent.conf
#   - 关闭 server_tokens(隐藏 nginx 版本,基本安全)
#   - 上传大小 100M(P8P9 提交整改材料可能带附件)
#   - 日志直接 stdout(json-file driver 收集)

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式(简洁)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # 客户端上传大小(P8 整改附件可能较大)
    client_max_body_size 100m;
    client_body_buffer_size 128k;

    # gzip(API 响应体积不大,只压 HTML/JSON 较大时)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
