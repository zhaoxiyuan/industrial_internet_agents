# a/deploy/nginx/conf.d/agent.conf — a/ 子项目公开 server 块
#
# 路由总览:
#   /                       → 80 强制跳 https
#   /webhooks/feishu/P8     → gateway:8787(飞书 webhook,无需鉴权)
#   /admin/p6/              → p6:5002(BasicAuth)
#   /admin/config/          → app_config:5000(BasicAuth)
#   /admin/feishu-cfg/      → feishu_cfg:5003(BasicAuth)
#
# 注:webui(8080) 不直接对外暴露 — 它只走 gateway → webui → p8p9 内部链路,
# 所以 Nginx 看不到 webui,也不需要 upstream 配置。
#
# ⚠ 部署前请修改 server_name 和 ssl_certificate 路径里的域名,
#   这里以 jlkwihudbifhaej.dpdns.org 为例。

# ─── 80 端口:HTTP → HTTPS 强制跳转 ───────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name jlkwihudbifhaej.dpdns.org;

    # 校验域名所有权用(Let's Encrypt 续期会 GET 这条 path)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部 301 跳 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 443 端口:HTTPS server 块 ───────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name jlkwihudbifhaej.dpdns.org;

    # ── TLS(Let's Encrypt 路径,deploy 时用 certbot 申请) ──
    ssl_certificate     /etc/letsencrypt/live/jlkwihudbifhaej.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jlkwihudbifhaej.dpdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 通用代理头(P6 WebSocket 需要 Upgrade/Connection) ──
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ───────────────────────────────────────────────
    # 1. 飞书 webhook(无鉴权)
    # ───────────────────────────────────────────────
    # feishu 会 POST 到这里,gateway 自己验证 token + 签名
    location /webhooks/feishu/ {
        proxy_pass http://gateway:8787/;
    }

    # ───────────────────────────────────────────────
    # 2. /admin/* — BasicAuth + 反代到 3 个 UI
    # ───────────────────────────────────────────────
    # 注意 location 顺序:^~ /admin/ 必须放最前(前缀匹配 + 锁定),
    # 否则 /webhooks/feishu/ 不会被 BasicAuth 拦(我们希望如此)
    location ^~ /admin/ {
        auth_basic           "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd;

        # WebSocket(P6 监测页实时推送用)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 飞书配置 UI
    location /admin/feishu-cfg/ {
        proxy_pass http://feishu_cfg:5003/;
    }

    # P6 监测 + A5/A6 看板(含 WebSocket)
    location /admin/p6/ {
        proxy_pass http://p6:5002/;
    }

    # LLM/VL 配置 UI
    location /admin/config/ {
        proxy_pass http://app_config:5000/;
    }

    # ───────────────────────────────────────────────
    # 3. 其他路径:返 404(不暴露任何未授权端点)
    # ───────────────────────────────────────────────
    location / {
        return 404 "Not Found";
    }
}
