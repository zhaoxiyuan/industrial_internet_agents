# Managed from the local workspace. Keep the existing authenticated SSH ingress.
worker_processes 1;
pid /Users/edge_security/ssh_remote/nginx.pid;
error_log /Users/edge_security/ssh_remote/error.log warn;
events { worker_connections 128; }
http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /Users/edge_security/ssh_remote/access.log;
    client_max_body_size 100m;
    map $http_origin $platform_origin {
        default $http_origin;
        "https://ladylike-overripe-resource.ngrok-free.dev" "http://127.0.0.1:18770";
    }
    server {
        listen 127.0.0.1:18080;
        server_name _;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        location ^~ /sshws/ {
            auth_basic "SSH Tunnel";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.ssh;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://127.0.0.1:18082;
        }
        location = /skill { return 308 /skill/; }
        location /skill/ {
            auth_basic "Skill Platform";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.admin;
            proxy_set_header Host 127.0.0.1:18770;
            proxy_set_header Origin $platform_origin;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:18770/;
        }
        # Existing frontend assets and API use root-relative paths.
        location ~ ^/(api|web)/ {
            auth_basic "Skill Platform";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.admin;
            proxy_set_header Host 127.0.0.1:18770;
            proxy_set_header Origin $platform_origin;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:18770;
        }
        location = /player { return 308 /player/; }
        location /player/ {
            auth_basic "Skill Platform";
            auth_basic_user_file /Users/edge_security/ssh_remote/htpasswd.admin;
            proxy_pass http://127.0.0.1:18090/;
        }
        location /skill-webhooks/feishu/ {
            limit_except POST { deny all; }
            proxy_set_header Host 127.0.0.1:18770;
            proxy_pass http://127.0.0.1:18770/webhooks/feishu/;
        }
        # Keep existing ingress while legacy containers remain enabled.
        location /webhooks/feishu/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:18081;
        }
        location = /feishu/card/callback {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:18081;
        }
        location /admin/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:18081;
        }
        location ^~ /api/closure/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:18081;
        }
        location ^~ /api/feishu/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:18081;
        }
        # Signed card/material links are verified by the platform.
        location ~ ^/(risk-card|risk-upload|risk-upload/submit|risk-material)$ {
            proxy_set_header Host 127.0.0.1:18770;
            proxy_pass http://127.0.0.1:18770;
        }
        location = / { return 302 /skill/; }
        location / { return 404 "Not Found"; }
    }
}
