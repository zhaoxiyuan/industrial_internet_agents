<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1040" viewBox="0 0 2500 1040">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="48" y="70" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0f172a" text-anchor="start">持续作业监测 · P6 → P7 → P8/P9 → P10</text>
<text x="48" y="115" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#334155" text-anchor="start">同一张作业票（job_id）贯穿全流程；每个子智能体单次执行，长期状态由业务库保存</text>
<rect x="48" y="153" width="2404" height="104" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="75" y="197" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#4338ca" text-anchor="start">主 Agent：周期触发</text>
<text x="400" y="199" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#4338ca" text-anchor="start">查询作业状态、数据积压和在途任务 → 安排有限执行 → 本轮结束</text>
<text x="75" y="236" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#6366f1" text-anchor="start">主 Agent 心跳 ≠ 数据采集；P6 可直接提交 P7，平台保留现有调用与授权逻辑</text>
<rect x="48" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="58" y="334" width="206" height="56" rx="10" fill="#e0f2fe" stroke="#e0f2fe" stroke-width="2"/>
<text x="161.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0284c7" text-anchor="middle">原始数据与窗口队列</text>
<text x="161.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">mock 实时采集入库</text>
<text x="161.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">关系表＋原始证据</text>
<text x="161.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">按消费者生成 x 秒窗</text>
