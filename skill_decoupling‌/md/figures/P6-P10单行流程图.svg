<text x="161.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="161.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0284c7" text-anchor="middle">pending / processing</text>
<text x="161.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">completed / retryable / failed</text>
<polyline points="277,442 305,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="315,442 303,435 303,449" fill="#64748b"/>
<rect x="318" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="328" y="334" width="206" height="56" rx="10" fill="#dbeafe" stroke="#dbeafe" stroke-width="2"/>
<text x="431.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">P6 · 窗口监测</text>
<text x="431.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">领取一个完整窗口</text>
<text x="431.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">分析异常与正常观测</text>
<text x="431.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">每次输出一份 JSON</text>
<polyline points="333,519 529,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="431.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="431.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">秒级证据 → 窗口成果</text>
<text x="431.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">按窗口独立执行</text>
<polyline points="547,442 575,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="585,442 573,435 573,449" fill="#64748b"/>
<rect x="588" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="598" y="334" width="206" height="56" rx="10" fill="#e0f2fe" stroke="#e0f2fe" stroke-width="2"/>
<text x="701.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0284c7" text-anchor="middle">P6 成果消费队列</text>
<text x="701.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">多窗口成果逐项入队</text>
<text x="701.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">含事件、证据和覆盖</text>
<text x="701.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">每项单独维护消费状态</text>
<polyline points="603,519 799,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="701.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="701.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0284c7" text-anchor="middle">pending / processing</text>
<text x="701.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">completed / retryable / failed</text>
<polyline points="817,442 845,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="855,442 843,435 843,449" fill="#64748b"/>
<rect x="858" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="868" y="334" width="206" height="56" rx="10" fill="#ede9fe" stroke="#ede9fe" stroke-width="2"/>
<text x="971.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">P7 · 聚合与研判</text>
<text x="971.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">一次领取多个新成果</text>
<text x="971.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">查询历史事件与证据</text>
<text x="971.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">聚合、关联、风险重评</text>
<polyline points="873,519 1069,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="971.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="971.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">批次大小不固定</text>
<text x="971.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">同一作业默认串行写入</text>
<polyline points="1087,442 1115,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="1125,442 1113,435 1113,449" fill="#64748b"/>
<rect x="1128" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1138" y="334" width="206" height="56" rx="10" fill="#ffedd5" stroke="#ffedd5" stroke-width="2"/>
<text x="1241.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#ea580c" text-anchor="middle">风险事件与告警队列</text>
<text x="1241.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">稳定 risk_event_id</text>
<text x="1241.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">保留来源与事件版本</text>
<text x="1241.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">新建告警／更新既有告警</text>
<polyline points="1143,519 1339,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="1241.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="1241.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#ea580c" text-anchor="middle">事件状态 ≠ 消费状态</text>
<text x="1241.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持续更新不重复开单</text>
<polyline points="1357,442 1385,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="1395,442 1383,435 1383,449" fill="#64748b"/>
<rect x="1398" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1408" y="334" width="206" height="56" rx="10" fill="#dcfce7" stroke="#dcfce7" stroke-width="2"/>
<text x="1511.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">P8 / P9 · 处置闭环</text>
<text x="1511.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">P8：通知与整改推进</text>
<text x="1511.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">P9：材料审核与闭环</text>
<text x="1511.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">人工等待留在业务状态</text>
<polyline points="1413,519 1609,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="1511.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="1511.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#16a34a" text-anchor="middle">一个事件对应一个工单</text>
<text x="1511.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">各次执行、回执均留存</text>
<polyline points="1627,442 1655,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="1665,442 1653,435 1653,449" fill="#64748b"/>
<rect x="1668" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1678" y="334" width="206" height="56" rx="10" fill="#fef3c7" stroke="#fef3c7" stroke-width="2"/>
<text x="1781.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">作业收尾与归档快照</text>
<text x="1781.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">结束采集并处理尾窗</text>
<text x="1781.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">排空 P6 / P7 队列</text>
<text x="1781.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">完成闭环并固定快照</text>
<polyline points="1683,519 1879,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="1781.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="1781.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">作业结束 ≠ 即刻归档</text>
<text x="1781.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">缺口／未闭环显式处理</text>
<polyline points="1897,442 1925,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="1935,442 1923,435 1923,449" fill="#64748b"/>
<rect x="1938" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1948" y="334" width="206" height="56" rx="10" fill="#ccfbf1" stroke="#ccfbf1" stroke-width="2"/>
<text x="2051.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">P10 · 汇总报告</text>
<text x="2051.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">读取固定作业快照</text>
<text x="2051.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">汇总多事件、多次记录</text>
<text x="2051.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">生成一份正式报告</text>
<polyline points="1953,519 2149,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="2051.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="2051.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d9488" text-anchor="middle">按事件 ID 去重统计</text>
<text x="2051.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">保留报告来源清单</text>
<polyline points="2167,442 2195,442" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="2205,442 2193,435 2193,449" fill="#64748b"/>
<rect x="2208" y="324" width="226" height="230" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="2218" y="334" width="206" height="56" rx="10" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="2"/>
<text x="2321.0" y="367" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">DOCX · 正式交付</text>
<text x="2321.0" y="431" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">一张票一份正式报告</text>
<text x="2321.0" y="466" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">JSON／证据继续留存</text>
<text x="2321.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="middle">修订生成新报告版本</text>
<polyline points="2223,519 2419,519" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="2321.0" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">持久化记录／可追溯引用</text>
<text x="2321.0" y="593" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">n : 1</text>
<text x="2321.0" y="621" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">保存位置＋哈希＋版本</text>
<text x="410" y="298" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2563eb" text-anchor="middle">x 秒窗口 → 1 份成果</text>
<text x="1135" y="298" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="middle">P6 候选 → P7 事件：n : m</text>
<text x="1510" y="298" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#16a34a" text-anchor="middle">事件 → 工单：1 : 1</text>
<text x="2200" y="298" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0d9488" text-anchor="middle">多次记录 → 报告：n : 1</text>
<rect x="48" y="668" width="770" height="222" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="712" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#7c3aed" text-anchor="start">P7 聚合：两种策略都保留原始事实</text>
<text x="72" y="755" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">按类型：多个窗口 → 头盔事件 ＋ 火焰事件（n:m）</text>
<text x="72" y="798" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">按态势：多个窗口 → 一个连续风险态势（n:1）</text>
<text x="72" y="843" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">态势事件内部保留独立子风险项；历史已消费成果仍可只读</text>
<rect x="846" y="668" width="790" height="222" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="870" y="712" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#0284c7" text-anchor="start">交接方式：队列管状态，文件管内容</text>
<text x="870" y="755" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">业务数据库：领取／租约／完成／重试／版本／来源关系</text>
<text x="870" y="797" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="start">JSON 落盘 → 保存回执 → 平台登记成果 → 下游按引用读取</text>
<text x="870" y="843" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">调用消息只提示有工作；正常窗口也入队，用于恢复判断</text>
<rect x="1664" y="668" width="788" height="222" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1688" y="712" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#16a34a" text-anchor="start">并发边界：跨作业并行，同事件受控更新</text>
<text x="1688" y="755" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">可并行：采集与分析、不同作业、不同事件的处置</text>
<text x="1688" y="798" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#334155" text-anchor="start">需串行：同作业 P7 写入、同工单变更、共享作业动作</text>
<text x="1688" y="843" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">P10 等待尾窗与闭环完成；基于固定快照生成正式报告</text>
<text x="48" y="955" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start">状态统一：pending 待处理 → processing 处理中 → completed 已完成；失败进入 retryable 或 failed</text>
<text x="48" y="997" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">目标设计示意：当前单成果 P7 接入需演进为批量队列；作业生命周期、执行状态与消费状态分开维护。</text>
</svg>